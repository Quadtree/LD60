services:
  app:
    build:
      dockerfile: Dockerfile
    volumes:
      - ./pages:/pages
      - ./manual.odt:/in/manual.odt
    network_mode: none
    entrypoint: ["/bin/bash", "-c"]
    command: ["rm /pages/* && pandoc -o /in/manual.odt /pages/manual.pdf && pdftocairo -png /pages/manual.pdf /pages/page"]
